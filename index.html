<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hogwarts Loy Krathong</title><style>*{box-sizing:border-box}body{margin:0;background:#080d25;color:#fff3d4;font-family:Tahoma,sans-serif;text-align:center}h1{font-family:Georgia,serif;font-size:clamp(30px,5vw,58px);margin:10px;color:#ffe3a0;text-shadow:0 0 22px #c68d40}header{padding:24px 12px 12px}p{line-height:1.6}#scene{height:390px;position:relative;overflow:hidden;background:linear-gradient(#080d25,#26365a 65%,#101e39 66%,#0b152d)}svg{width:100%;height:100%;position:absolute;inset:0}.star{position:absolute;background:#fff4cc;border-radius:50%;animation:twinkle 2s infinite alternate}@keyframes twinkle{to{opacity:.2}}.panel{max-width:740px;margin:20px auto;padding:24px;background:#151d36;border:1px solid #9d8050;border-radius:22px;box-shadow:0 10px 40px #0006}.houses{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button,input,textarea{font:inherit;border-radius:12px;padding:12px;border:1px solid #8b795b}button{cursor:pointer;color:#fff;background:#27334e}.house{font-size:13px;min-height:90px}.house span{display:block;font-size:32px}.house.active{outline:2px solid #ffe4a0;background:#51442f}input,textarea{display:block;width:100%;margin:12px 0;background:#0d142a;color:white}textarea{resize:vertical}#launch{background:linear-gradient(110deg,#a77732,#ffe0a0);color:#251a0c;font-weight:bold;width:100%}.float{position:absolute;z-index:3;bottom:10px;left:50%;font-size:52px;filter:drop-shadow(0 0 12px gold);animation:sail 9s ease-out forwards;pointer-events:none}@keyframes sail{to{transform:translate(160px,-95px) scale(.22);opacity:.3}}.spark{position:absolute;color:#ffe4a0;animation:burst 1.5s forwards;pointer-events:none}@keyframes burst{to{transform:translate(var(--x),var(--y));opacity:0}}#result{white-space:pre-wrap;color:#ffe0a0}footer{padding:20px;color:#a8acc1;font-size:12px}@media(max-width:600px){.panel{margin:12px}.houses{grid-template-columns:repeat(2,1fr)}#scene{height:300px}}@media(prefers-reduced-motion:reduce){.star,.float,.spark{animation-duration:.01s}}</style></head><body><header><small>✦ A MAGICAL FULL MOON FESTIVAL ✦</small><h1>Hogwarts Loy Krathong</h1><p>คืนจันทร์เพ็ญแห่งเวทมนตร์ • ลอยความทุกข์ ฝากความหวังไว้กับสายน้ำ</p></header><div id="scene"><svg viewBox="0 0 900 390" preserveAspectRatio="xMidYMid slice" aria-label="ปราสาทเวทมนตร์ริมทะเลสาบ"><defs><radialGradient id="moon"><stop stop-color="#fffbe3"/><stop offset="1" stop-color="#e7c98b"/></radialGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="#293d60"/><stop offset="1" stop-color="#091326"/></linearGradient></defs><circle cx="690" cy="75" r="48" fill="url(#moon)"/><path d="M0 240L130 120 240 225 350 140 510 240 690 160 900 240V270H0Z" fill="#151d35"/><g fill="#252334" stroke="#76654f" stroke-width="1.4"><path d="M235 260V155H290V260M220 155L262 75 305 155Z M290 260V190H390V260M280 190L340 130 400 190Z M390 260V95H455V260M375 95L422 12 470 95Z M455 260V150H550V260M445 150L502 92 560 150Z M550 260V125H590V260M540 125L570 55 600 125Z M590 260V195H650V260M580 195L620 145 660 195Z"/></g><g id="windows" fill="#ffcf77"></g><path d="M0 260Q220 245 450 260T900 260V390H0Z" fill="url(#water)"/><g id="ripples" stroke="#e6c68a" opacity=".25" stroke-linecap="round"></g></svg></div><main class="panel"><h2>เลือกกระทงประจำบ้านของคุณ</h2><div class="houses"><button class="house active" data-house="0"><span>🦁</span>Gryffindor</button><button class="house" data-house="1"><span>🐍</span>Slytherin</button><button class="house" data-house="2"><span>🦅</span>Ravenclaw</button><button class="house" data-house="3"><span>🦡</span>Hufflepuff</button></div><form id="wish"><input id="name" maxlength="60" placeholder="ชื่อพ่อมด / แม่มด" aria-label="ชื่อ" required><textarea id="message" maxlength="500" rows="3" placeholder="เขียนคำอธิษฐานใต้แสงจันทร์..." aria-label="คำอธิษฐาน" required></textarea><button id="launch">✦ ร่ายมนตร์และลอยกระทง ✦</button></form><p id="result" role="status"></p><button id="share">แชร์เว็บไซต์ให้เพื่อน</button></main><footer>Fan-made festival experience • ไม่ใช่เว็บไซต์ทางการของ Harry Potter • คำอธิษฐานไม่ถูกส่งไปยังเซิร์ฟเวอร์</footer><script>const scene=document.querySelector('#scene'),ns='http://www.w3.org/2000/svg';for(let i=0;i<70;i++){let s=document.createElement('i');s.className='star';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*55}%;width:2px;height:2px;animation-delay:${Math.random()*3}s`;scene.append(s)}for(const [x,y,w,h] of [[235,155,55,105],[290,190,100,70],[390,95,65,165],[455,150,95,110],[550,125,40,135],[590,195,60,65]])for(let a=x+12;a<x+w-8;a+=18)for(let b=y+14;b<y+h-12;b+=27){let r=document.createElementNS(ns,'rect');for(const [k,v] of Object.entries({x:a,y:b,width:7,height:13,rx:3}))r.setAttribute(k,v);document.querySelector('#windows').append(r)}for(let i=0;i<28;i++){let r=document.createElementNS(ns,'line'),x=330+Math.random()*420,y=270+Math.random()*120;for(const [k,v] of Object.entries({x1:x,x2:x+Math.random()*80,y1:y,y2:y}))r.setAttribute(k,v);document.querySelector('#ripples').append(r)}let selected=0;const colors=['#ff5454','#58e49a','#75baff','#ffdf65'],bless=['ขอให้ความกล้าหาญนำทางสู่ความสำเร็จ','ขอให้ทุกความฝันเป็นจริงด้วยพลังแห่งความมุ่งมั่น','ขอให้ปัญญาและแรงบันดาลใจส่องทาง','ขอให้พบมิตรภาพ ความสุข และความอบอุ่น'];document.querySelectorAll('.house').forEach(b=>b.onclick=()=>{selected=+b.dataset.house;document.querySelectorAll('.house').forEach(x=>x.classList.toggle('active',x===b))});document.querySelector('#wish').onsubmit=e=>{e.preventDefault();let f=document.createElement('div');f.className='float';f.style.filter=`drop-shadow(0 0 15px ${colors[selected]})`;f.innerHTML=`<svg style="position:static;width:100px;height:80px" viewBox="0 0 100 80"><ellipse cx="50" cy="65" rx="46" ry="10" fill="#244e37"/><path d="M5 60L20 30 35 57 50 25 65 57 80 30 95 60Q50 80 5 60" fill="${colors[selected]}"/><rect x="46" y="24" width="8" height="32" rx="2" fill="#fff1c2"/><path d="M50 3Q65 22 50 25Q36 22 50 3" fill="#ffcf55"/></svg>`;scene.append(f);setTimeout(()=>f.remove(),10000);for(let i=0;i<24;i++){let s=document.createElement('span');s.className='spark';s.textContent='✦';s.style.cssText=`left:50%;bottom:45px;--x:${Math.random()*300-150}px;--y:${-Math.random()*180}px`;scene.append(s);setTimeout(()=>s.remove(),1600)}document.querySelector('#result').textContent='✨ '+document.querySelector('#name').value+' ลอยกระทงสำเร็จแล้ว!\n“'+document.querySelector('#message').value+'”\n'+bless[selected];scene.scrollIntoView({behavior:'smooth',block:'center'})};document.querySelector('#share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:document.title,url:location.href});else{await navigator.clipboard.writeText(location.href);alert('คัดลอกลิงก์แล้ว')}}catch(e){if(e.name!=='AbortError')prompt('คัดลอกลิงก์เว็บไซต์',location.href)}};</script></body></html>
